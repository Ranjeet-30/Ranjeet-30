name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ranjeet-30
          outputs: |
            assets/github-snake.svg?palette=github-dark

      - name: Commit generated animation
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/github-snake.svg"
          message: "chore: update contribution animation"
